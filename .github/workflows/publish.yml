# Publishes the three packages to npm on a tag push like `v0.1.0`. They ship
# in lockstep: @nustackdev/tape-scene, @nustackdev/tape-player, @nustackdev/tape.
# Manual "Run workflow" dispatch builds and checks but does NOT publish.
#
# Setup once:
#   1. Generate a granular npm access token scoped to @nustackdev/*, with
#      publish permission, bypass-2FA enabled.
#   2. Add it as GitHub repo secret `NPM_TOKEN`.
#
# Release flow:
#   1. Bump `version` in all three packages/*/package.json to X.Y.Z.
#   2. Commit and push to main.
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check
        run: pnpm typecheck && pnpm test && pnpm check

      - name: Tag matches every package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            got=$(node -p "require('./$p').version")
            if [ "$got" != "$want" ]; then
              echo "::error::$p is $got, tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
