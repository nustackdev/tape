# Publishes the three packages to npm on a tag push like `v0.1.0`. They ship
# in lockstep: @nustackdev/tape-scene, @nustackdev/tape-player, @nustackdev/tape.
# Manual "Run workflow" dispatch builds and checks but does NOT publish.
#
# No token: npm trusted publishing. Each package trusts this workflow
# (npmjs.com, package settings, or `npm trust github <pkg> --file
# publish.yml --repo nustackdev/tape --allow-publish`), and the job's GitHub
# identity is what npm checks. Provenance comes with it.
#
# Release flow:
#   1. Bump `version` in all three packages/*/package.json to X.Y.Z.
#   2. Commit and push to main.
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check
        run: pnpm typecheck && pnpm test && pnpm check

      - name: Tag matches every package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            got=$(node -p "require('./$p').version")
            if [ "$got" != "$want" ]; then
              echo "::error::$p is $got, tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      # pnpm packs, so workspace:* becomes the real version. npm publishes,
      # since trusted publishing needs npm 11.5.1 or later.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm install -g npm@latest
          mkdir -p .pack
          for p in scene player recorder; do
            (cd packages/$p && pnpm pack --pack-destination ../../.pack)
          done
          for p in scene player recorder; do
            name=$(node -p "require('./packages/$p/package.json').name")
            # Already out (a re-run, or one that got through before a failure): skip it.
            if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$name@${GITHUB_REF_NAME#v} is already published"
              continue
            fi
            npm publish .pack/$(echo "$name" | sed 's|^@||; s|/|-|')-${GITHUB_REF_NAME#v}.tgz --access public
          done
